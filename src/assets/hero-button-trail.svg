<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 360 360" fill="none">
  <defs>
    <linearGradient id="light" x1="195" y1="48" x2="120" y2="221" gradientUnits="userSpaceOnUse">
      <stop stop-color="#efd264"/>
      <stop offset=".38" stop-color="#ffe5a1"/>
      <stop offset=".7" stop-color="#f5f5ff"/>
      <stop offset="1" stop-color="#bcdcff"/>
    </linearGradient>
    <!-- Two equal discs offset diagonally: their intersections form the tapered ends. -->
    <mask id="outside" maskUnits="userSpaceOnUse" x="-60" y="-60" width="360" height="360"><rect x="-60" y="-60" width="360" height="360" fill="white"/><circle cx="120" cy="120" r="93.75" fill="black"/></mask>
  </defs>
  <g mask="url(#outside)">
    <circle cx="125" cy="125" r="94" fill="url(#light)" opacity=".4"/>
    <circle cx="125" cy="125" r="94" fill="url(#light)" opacity=".7"/>
  </g>
</svg>
